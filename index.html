<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<title>Rony Saad Studio</title>
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cairo:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<!-- Connect screen -->
<section id="connect" class="connect" hidden>
  <div class="connect-card">
    <div class="wordmark big">RONY<span>.</span>SAAD<em>®</em></div>
    <p class="eyebrow">Studio / Bookings / Money</p>
    <form id="connectForm" class="stack">
      <label class="field" id="cUrlField"><span>Google Sheet link (Apps Script web app URL)</span>
        <input id="cUrl" type="url" required placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false"></label>
      <label class="field"><span>Passcode</span>
        <input id="cKey" type="text" required inputmode="numeric" autocomplete="off" placeholder="Your passcode" maxlength="12"></label>
      <button class="btn primary" type="submit" id="cGo">Open studio <span class="arrow">↗</span></button>
      <p class="msg" id="cMsg" role="status"></p>
    </form>
    <p class="fine">Your data lives in your own Google Sheet. This device remembers the link until you disconnect.</p>
  </div>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="top">
    <a href="#today" class="wordmark" aria-label="Studio home">RONY<span>.</span>SAAD<em>®</em></a>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#today" data-v="today">Today</a>
      <a href="#projects" data-v="projects">Projects</a>
      <a href="#clients" data-v="clients">Clients</a>
      <a href="#money" data-v="money">Money</a>
    </nav>
    <div class="top-right">
      <button class="sync" id="syncBtn" type="button" title="Sync now"><i class="dot"></i><span id="syncTxt">Synced</span></button>
      <button type="button" class="icon-btn" aria-label="Search everything" title="Search ( / )" id="searchBtn" data-search></button>
      <button type="button" class="icon-btn" aria-label="More: retainers, settings" id="moreBtn" data-more></button>
      <a href="#settings" data-v="settings" class="icon-btn" aria-label="Settings" id="setLink"></a>
      <button class="btn primary sm add-top" type="button" data-add>+ New booking</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-v="today"><i data-ic="today"></i><span>Today</span></a>
    <a href="#projects" data-v="projects"><i data-ic="folder"></i><span>Projects</span></a>
    <button type="button" class="tab-add" data-add aria-label="New booking"><i data-ic="plus"></i></button>
    <a href="#clients" data-v="clients"><i data-ic="users"></i><span>Clients</span></a>
    <a href="#money" data-v="money"><i data-ic="wallet"></i><span>Money</span></a>
  </nav>
</div>

<!-- Drawer + modal roots -->
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawerTitle"></aside>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="invoice" class="invoice" aria-hidden="true"></div>

<script src="app.js"></script>
</body>
</html>
